<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CampusConnect event discovery and registration portal" />
    <title>CampusConnect — Explore Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand"><div class="brand-mark">✦</div><div><strong>CampusConnect</strong><small>State Polytech Hub</small></div></div>
        <div class="nav-label">Portal workspace</div>
        <nav class="nav-list">
          <button class="nav-item active" data-view="explore"><span>⌕</span>Explore events</button>
          <button class="nav-item" data-view="registrations"><span>▣</span>My registrations</button>
          <button class="nav-item" data-view="organizer"><span>◈</span>Organizer studio</button>
        </nav>
        <div class="sidebar-footer"><span class="status-dot"></span><span>Hub v2.4 live</span><span class="verified">Verified</span></div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="mobile-brand"><div class="brand-mark">✦</div><strong>CampusConnect</strong></div>
          <label class="search-wrap"><span>⌕</span><input id="search-input" type="search" placeholder="Search campus events, hackathons, clubs..." /></label>
          <div class="profile"><button class="icon-button" aria-label="Notifications">♧<i></i></button><div class="avatar">AR</div><div class="profile-copy"><strong>Alex Rivera</strong><small>alex.rivera@polytech.edu</small></div></div>
        </header>

        <section id="app" class="page" aria-live="polite">
          <div class="loading-card"><div class="spinner"></div><p>Loading your campus events…</p></div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="./api-client.js?v=20261105-2"></script>
    <script src="./app.js"></script>
  </body>
</html>
